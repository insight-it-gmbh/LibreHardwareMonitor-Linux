<!DOCTYPE html>
<html lang="de"><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* Transparenter Hintergrund: funktioniert in GitHubs Light- UND Dark-Mode */
  html,body{background:transparent}
  body{width:560px;height:120px;display:flex;align-items:center;
       font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}

  /* 1:1 die Lockup-Regeln aus insight-v6/site (.brand) */
  .brand{display:flex;align-items:center;gap:16px;padding-left:8px}
  .brand svg{width:auto;height:56px;
             filter:drop-shadow(0 0 8px rgba(157,205,90,.55))}
  .word{display:flex;flex-direction:column;gap:6px;line-height:1}
  .word b{font-weight:700;font-size:31px;letter-spacing:.04em;color:#9DCD5A}
  .word small{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;
              color:#8b949e;font-weight:500}
</style>
<div class="brand">
  <!-- Original-Pfade aus insight-v6/site/assets/logo.svg -->
  <svg viewBox="110 270 190 310" xmlns="http://www.w3.org/2000/svg">
    <path d="M209 285 L125 334 L125 510 L166 527 L166 415 L193 413 L195 537 L212 543 Z
             M166 368 L193 367 L195 369 L195 395 L193 397 L167 397 Z"
          fill="#9DCD5A" fill-rule="evenodd"/>
    <path d="M235 313 L233 562 L283 529 L284 355 Z" fill="#9DCD5A"/>
  </svg>
  <span class="word">
    <b>INSIGHT-IT</b>
    <small>IT-Systemhaus Berlin</small>
  </span>
</div>
</html>
